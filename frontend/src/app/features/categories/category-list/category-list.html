<div class="page-header">
  <div>
    <span class="eyebrow">Registos</span>
    <h1>Categorias</h1>
    <p class="page-subtitle">Classificação das despesas para análise e relatórios.</p>
  </div>
  <button mat-flat-button (click)="openForm()">
    <span class="material-symbols-outlined">add</span>
    Nova categoria
  </button>
</div>

<div class="panel">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <table mat-table [dataSource]="categories()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let category" class="cell-primary">{{ category.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Descrição</th>
      <td mat-cell *matCellDef="let category" class="muted">{{ category.description ?? '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let category" class="actions">
        <button mat-button (click)="openForm(category)">Editar</button>
        @if (auth.isAdmin()) {
          <button mat-button class="danger" (click)="delete(category)">Apagar</button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
    <tr class="mat-mdc-row no-data" *matNoDataRow>
      <td class="mat-mdc-cell empty" [attr.colspan]="columns.length">Ainda não há categorias.</td>
    </tr>
  </table>
</div>
