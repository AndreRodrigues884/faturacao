<div class="page-header">
  <h1>Clientes</h1>
  <button mat-flat-button (click)="openForm()">Novo cliente</button>
</div>

<mat-form-field appearance="outline" class="search" subscriptSizing="dynamic">
  <mat-label>Pesquisar por nome ou NIF</mat-label>
  <input matInput [formControl]="search" />
</mat-form-field>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

<table mat-table [dataSource]="clients()">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell *matCellDef="let client">{{ client.name }}</td>
  </ng-container>

  <ng-container matColumnDef="nif">
    <th mat-header-cell *matHeaderCellDef>NIF</th>
    <td mat-cell *matCellDef="let client">{{ client.nif }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let client">{{ client.email ?? '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>Cidade</th>
    <td mat-cell *matCellDef="let client">{{ client.city ?? '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let client" class="actions">
      <button mat-button (click)="openForm(client)">Editar</button>
      @if (auth.isAdmin()) {
        <button mat-button class="danger" (click)="delete(client)">Apagar</button>
      }
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
  <tr class="mat-mdc-row" *matNoDataRow>
    <td class="mat-mdc-cell empty" [attr.colspan]="columns.length">Nenhum cliente encontrado.</td>
  </tr>
</table>
