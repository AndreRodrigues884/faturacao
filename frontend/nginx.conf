# Serve o Angular e reencaminha /api para o backend (substitui o proxy.conf.json do ng serve).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pedidos à API seguem para o contentor do backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ficheiros com código único no nome (main-K7X2Q.js) podem ficar em cache um ano
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Qualquer outro endereço (/faturas, /clientes/5...) é uma rota do Angular
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}